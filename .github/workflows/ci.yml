name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install project
        run: uv sync --locked

      - name: Check formatting
        run: uv run --with ruff ruff format --check .

      - name: Run Ruff
        run: uv run --with ruff ruff check .

      - name: Run Mypy
        run: uv run --with mypy --with pytest mypy src tests

      - name: Run tests
        run: uv run --with pytest --with pytest-cov pytest --cov=srs_fs740 --cov-branch --cov-fail-under=55

      - name: Build distribution
        run: uv build

      - name: Smoke test built wheel
        run: |
          python -m venv .smoke
          . .smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import srs_fs740; print(srs_fs740.__all__)"
