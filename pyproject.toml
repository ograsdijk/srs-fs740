[project]
name = "srs-fs740"
version = "0.1.0"
description = "Python helpers for the Stanford Research Systems FS740 time and frequency instrument"
readme = "README.md"
authors = [
    { name = "ograsdijk", email = "o.grasdijk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.4",
    "pyvisa>=1.14.1",
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/ograsdijk/srs-fs740"
Repository = "https://github.com/ograsdijk/srs-fs740"
Issues = "https://github.com/ograsdijk/srs-fs740/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
